webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = [
        "--window-size=1440,900",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-features=PasswordLeakDetection"
      ]
      # stop Chrome's "password found in a data breach" popup from blocking clicks
      prefs {
        credentials_enable_service = false
        profile {
          password_manager_enabled = false
          password_manager_leak_detection = false
        }
      }
    }
  }
}

# the React app renders after page load: let element lookups wait instead of failing at once
webdriver.timeouts.implicitlywait = 5000

serenity {
  take.screenshots = FOR_EACH_ACTION
}

# default: headless (CI and plain `./mvnw verify`); `-Denvironment=headed` opens a visible browser
environments {
  default {
    headless.mode = true
  }
  headed {
    headless.mode = false
  }
}
